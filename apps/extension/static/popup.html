<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kairos Blocker</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <main>
      <h1 class="title-row">Kairos Blocker <span class="muted small">v<span id="version"></span></span></h1>
      <p class="status" id="status"><span class="dot" aria-hidden="true"></span> <span id="status-text"></span></p>
      <p class="small link-status" id="link"></p>
      <p class="small link-status" id="phone-link" hidden></p>
      <p class="muted small" id="hint"></p>
      <p class="notice small" id="yt-access" hidden>
        YouTube channels, tags and phrases need access to YouTube pages.
        <button type="button" class="button primary" id="yt-allow">Allow on YouTube</button>
      </p>

      <section class="panel timer" id="timer" aria-labelledby="timer-title">
        <h2 class="panel-title" id="timer-title"><span>focus timer</span></h2>
        <div id="timer-idle">
          <div class="chips" id="presets" aria-label="Ready-made lengths"></div>
          <div class="timer-fields">
            <label>Focus <input id="t-focus" class="minutes" type="number" min="1" max="240" /> min</label>
            <label>Break <input id="t-break" class="minutes" type="number" min="0" max="60" /> min</label>
            <label>Rounds <input id="t-rounds" class="minutes" type="number" min="1" max="12" /></label>
          </div>
          <p class="actions"><button type="button" class="button primary" id="t-start">Start focus</button></p>
        </div>
        <div id="timer-running" hidden>
          <p class="timer-left num" id="t-left">0:00</p>
          <p class="muted small" id="t-phase"></p>
          <p class="actions">
            <button type="button" class="button primary" id="t-pause">Pause</button>
            <button type="button" class="button" id="t-skip">Skip</button>
            <button type="button" class="button link" id="t-stop">Stop</button>
          </p>
        </div>
        <p class="muted small" id="t-note"></p>
      </section>

      <section class="panel" id="site" hidden aria-labelledby="site-name">
        <h2 class="panel-title"><span>this site</span></h2>
        <p><strong id="site-name"></strong> <span class="muted small" id="site-rule"></span></p>
        <p class="actions">
          <button type="button" class="button" id="add-wait"></button>
          <button type="button" class="button" id="add-block">Full block</button>
          <button type="button" class="button link" id="remove">Remove</button>
        </p>
      </section>

      <p class="actions">
        <button type="button" class="button" id="options">Sites, YouTube and phone</button>
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
